name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ODIN_RELEASE: dev-2026-09

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev
      - name: Install Odin
        run: |
          curl -fsSL -o odin.tar.gz "https://github.com/odin-lang/Odin/releases/download/$ODIN_RELEASE/odin-linux-amd64-$ODIN_RELEASE.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf odin.tar.gz -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
      - run: make test
